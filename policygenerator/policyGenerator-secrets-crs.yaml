apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: falcon-operator-secrets-crs
placementBindingDefaults:
  name: binding-falcon-operator-secrets-crs
policyDefaults:
  namespace: rhacm-policies
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  standards:
    - NIST SP 800-53
  severity: high
  remediationAction: enforce
  pruneObjectBehavior: DeleteIfCreated
  orderPolicies: true
  placement:
    # Reuse the same Placement name as the install policy (same selector file)
    placementPath: input/placement/placement-falcon-operator.yaml
policies:
  # Keep disabled until ExternalSecret has materialized falcon-api-credentials
  - name: policy-falcon-secrets
    disabled: true
    manifests:
      - path: input/secrets/falcon-secrets.yaml
    configurationPolicyAnnotations:
      policy.open-cluster-management.io/disable-templates: "false"

  - name: policy-falcon-crs
    disabled: true
    manifests:
      - path: input/falcon-crs/
