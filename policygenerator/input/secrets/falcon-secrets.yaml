# Credentials are injected from a Secret on the ACM hub via hub templates.
# Create the hub secret once (see README) before enforcing this policy:
#
#   oc create secret generic falcon-api-credentials -n policies \
#     --from-literal=falcon-client-id='YOUR_CLIENT_ID' \
#     --from-literal=falcon-client-secret='YOUR_CLIENT_SECRET' \
#     --from-literal=falcon-cid='YOUR_CID' \
#     --from-literal=falcon-provisioning-token=''
#
# Do NOT commit real credentials to Git.
---
apiVersion: v1
kind: Secret
metadata:
  name: falcon-secrets
  namespace: falcon-operator
  labels:
    app.kubernetes.io/name: falcon-secrets
    app.kubernetes.io/part-of: crowdstrike-falcon
    app.kubernetes.io/managed-by: acm-policy
type: Opaque
stringData:
  falcon-client-id: '{{hub fromSecret "policies" "falcon-api-credentials" "falcon-client-id" hub}}'
  falcon-client-secret: '{{hub fromSecret "policies" "falcon-api-credentials" "falcon-client-secret" hub}}'
  falcon-cid: '{{hub fromSecret "policies" "falcon-api-credentials" "falcon-cid" hub}}'
  falcon-provisioning-token: '{{hub fromSecret "policies" "falcon-api-credentials" "falcon-provisioning-token" hub}}'
