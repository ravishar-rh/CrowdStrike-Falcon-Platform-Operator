# Credentials are injected from a Secret on the ACM hub via hub templates.
# Materialize the hub Secret with External Secrets Operator (GitOps), not manually:
#   gitops/external-secrets/externalsecret-falcon-api-credentials.yaml
#   gitops/application-external-secrets.yaml
#
# Do NOT commit real credentials to Git.
---
apiVersion: v1
kind: Secret
metadata:
  name: falcon-secrets
  namespace: falcon-operator
  labels:
    app.kubernetes.io/name: falcon-secrets
    app.kubernetes.io/part-of: crowdstrike-falcon
    app.kubernetes.io/managed-by: acm-policy
type: Opaque
stringData:
  falcon-client-id: '{{hub fromSecret "rhacm-policies" "falcon-api-credentials" "falcon-client-id" hub}}'
  falcon-client-secret: '{{hub fromSecret "rhacm-policies" "falcon-api-credentials" "falcon-client-secret" hub}}'
  falcon-cid: '{{hub fromSecret "rhacm-policies" "falcon-api-credentials" "falcon-cid" hub}}'
  falcon-provisioning-token: '{{hub fromSecret "rhacm-policies" "falcon-api-credentials" "falcon-provisioning-token" hub}}'
