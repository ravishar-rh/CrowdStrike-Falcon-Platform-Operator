apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default build: operator install only (safe for app-of-apps without AWS creds).
# To also emit secrets/CR policies: kustomize build --enable-alpha-plugins .
# with both generators, or run ../scripts/generate-policies.sh

generators:
  - policyGenerator-install.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: crowdstrike-falcon
      app.kubernetes.io/managed-by: policy-generator
    includeSelectors: false
