apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: falcon-operator-policies
placementBindingDefaults:
  name: binding-falcon-operator
policyDefaults:
  namespace: rhacm-policies
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  standards:
    - NIST SP 800-53
  severity: high
  remediationAction: enforce
  pruneObjectBehavior: DeleteIfCreated
  # Apply policies in list order (operator → secrets → CRs)
  orderPolicies: true
  # Shared Placement so hub + imported OpenShift clusters receive all Falcon policies
  placement:
    placementPath: input/placement/placement-falcon-operator.yaml
  policySets:
    - falcon-platform
policies:
  # 1) Namespaces + OperatorGroup + Subscription (OLM installs CSV RBAC automatically)
  - name: policy-falcon-operator-install
    disabled: false
    manifests:
      - path: input/operator/

  # 2) Credentials Secret (values from hub Secret via hub templates)
  - name: policy-falcon-secrets
    disabled: false
    manifests:
      - path: input/secrets/falcon-secrets.yaml
    configurationPolicyAnnotations:
      # Required so {{hub ...}} templates are evaluated on the hub
      policy.open-cluster-management.io/disable-templates: "false"

  # 3) Falcon custom resources (created after operator CSV is available)
  - name: policy-falcon-crs
    disabled: false
    manifests:
      - path: input/falcon-crs/

policySets:
  - name: falcon-platform
    description: >-
      Installs CrowdStrike Falcon Platform Operator v1.15.0 (certified-1.0)
      plus Node Sensor, Admission Controller, and Image Analyzer on the
      ROSA HCP hub and all imported OpenShift clusters.
    placement:
      placementPath: input/placement/placement-falcon-operator.yaml
