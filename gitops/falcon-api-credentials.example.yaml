# Example only — DO NOT commit real values.
# Create this Secret on the ACM hub in the `rhacm-policies` namespace before enforcing.
#
#   oc apply -f gitops/falcon-api-credentials.example.yaml
#   # then edit the secret with real values, or create via:
#
#   oc create secret generic falcon-api-credentials -n rhacm-policies \
#     --from-literal=falcon-client-id='YOUR_CLIENT_ID' \
#     --from-literal=falcon-client-secret='YOUR_CLIENT_SECRET' \
#     --from-literal=falcon-cid='YOUR_CID_WITH_CHECKSUM' \
#     --from-literal=falcon-provisioning-token=''
---
apiVersion: v1
kind: Secret
metadata:
  name: falcon-api-credentials
  namespace: rhacm-policies
  labels:
    app.kubernetes.io/name: falcon-api-credentials
    app.kubernetes.io/part-of: crowdstrike-falcon
type: Opaque
stringData:
  falcon-client-id: REPLACE_ME
  falcon-client-secret: REPLACE_ME
  falcon-cid: REPLACE_ME
  # Optional; leave empty string if unused
  falcon-provisioning-token: ""
