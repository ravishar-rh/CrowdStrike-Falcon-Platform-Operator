# Argo CD Application: sync ExternalSecret that materializes
# Secret/falcon-api-credentials in rhacm-policies (for ACM hub templates).
#
# Apply once on the hub (or include in your existing app-of-apps):
#   oc apply -f gitops/application-external-secrets.yaml
#
# Update repoURL if needed. Point secretStoreRef in
# gitops/external-secrets/externalsecret-falcon-api-credentials.yaml
# at your ClusterSecretStore before syncing.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falcon-api-credentials-eso
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: falcon-api-credentials
    app.kubernetes.io/part-of: crowdstrike-falcon
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ravishar-rh/CrowdStrike-Falcon-Platform-Operator.git
    targetRevision: main
    path: gitops/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: rhacm-policies
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
