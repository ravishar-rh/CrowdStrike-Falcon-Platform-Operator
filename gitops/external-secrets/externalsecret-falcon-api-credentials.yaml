# Syncs Falcon API credentials from your external secret backend into the
# Kubernetes Secret that ACM hub templates consume:
#   Secret/falcon-api-credentials in namespace rhacm-policies
#
# Prerequisites:
#   1. External Secrets Operator installed on the ACM hub
#   2. A ready ClusterSecretStore (or SecretStore) — set secretStoreRef below
#   3. Remote secret created in AWS SM / Vault / etc. with the keys listed in `data`
#
# This replaces any manual `oc create secret` for Falcon credentials.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcon-api-credentials
  namespace: rhacm-policies
  labels:
    app.kubernetes.io/name: falcon-api-credentials
    app.kubernetes.io/part-of: crowdstrike-falcon
    app.kubernetes.io/managed-by: openshift-gitops
spec:
  refreshInterval: 1h
  # >>> CHANGE THIS to your existing store name/kind <<<
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: falcon-api-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: falcon-api-credentials
          app.kubernetes.io/part-of: crowdstrike-falcon
  data:
    # Remote key path example for AWS Secrets Manager:
    #   crowdstrike/falcon-operator
    # JSON properties (or SM plaintext key/value) must match `property` below.
    - secretKey: falcon-client-id
      remoteRef:
        key: crowdstrike/falcon-operator
        property: falcon-client-id
    - secretKey: falcon-client-secret
      remoteRef:
        key: crowdstrike/falcon-operator
        property: falcon-client-secret
    - secretKey: falcon-cid
      remoteRef:
        key: crowdstrike/falcon-operator
        property: falcon-cid
    - secretKey: falcon-provisioning-token
      remoteRef:
        key: crowdstrike/falcon-operator
        property: falcon-provisioning-token
